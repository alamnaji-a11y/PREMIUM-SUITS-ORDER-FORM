
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesale Suit Order System</title>
    <!-- Production Build v1.1 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Screen Styles */
        body { background: #f1f5f9; color: #1e293b; }
        
        /* Shared Ticket Styles (Visible in Preview Mode & Print) */
        .job-ticket { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-family: sans-serif; font-size: 11px; color: black; }
        .job-ticket th, .job-ticket td { border: 1px solid #000; padding: 4px 8px; text-align: left; }
        .job-ticket th { background-color: #e2e8f0; font-weight: bold; width: 40%; }
        .job-ticket td { width: 60%; font-weight: 500; }
        .section-header { background-color: #000; color: #fff !important; font-weight: bold; text-transform: uppercase; padding: 6px; text-align: center; }
        
        .print-layout-cols { column-count: 2; column-gap: 20px; }
        .print-break { break-inside: avoid; margin-bottom: 10px; }

        /* Print Media Query */
        @media print {
            .no-print, .screen-only { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; -webkit-print-color-adjust: exact; margin: 0; padding: 0; }
            .preview-container { margin: 0; padding: 0; box-shadow: none; max-width: 100%; border: none; }
        }

        /* Utility classes for screen view */
        .print-only { display: none; }
        
        /* When Preview Mode is Active (toggled via React state applying class to body/container) */
        body.preview-active .screen-only { display: none !important; }
        body.preview-active .print-only { display: block !important; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
